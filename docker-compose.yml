services:
  # Main Trading Application
  trading_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ── Infrastructure overrides for Docker networking ──────────────────
      # Container names replace localhost for inter-service communication.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-trading_pass}@postgres:5432/${POSTGRES_DB:-trading_db}
      REDIS_URL: redis://redis:6379/0

      # ── Runtime mode ───────────────────────────────────────────────────
      EA_MODE: "true"
      EA_LOG_SERVER_HOST: "0.0.0.0"
      EA_LOG_SERVER_PORT: "8000"
      TRADE_LOG_CSV_PATH: "/app/logs/MTFTR_TradeLog.csv"

      # ── Broker bridge (MT5 runs on Windows host) ───────────────────────
      BROKER_MODE: bridge
      MT5_BRIDGE_URL: http://host.docker.internal:8001

      # ── Trading settings are loaded from the database (user_settings    ──
      # ── table) at runtime, NOT from environment variables.              ──
      # ── The .env values serve only as seed defaults for new users.      ──
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading_network

  # PostgreSQL with TimescaleDB for time-series data
  postgres:
    image: timescale/timescaledb:2.14.2-pg15
    container_name: trading_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_pass}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user} -d ${POSTGRES_DB:-trading_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for rate limiting and real-time state
  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - trading_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Note: SigNoz is set up separately in its own Docker Compose stack
  # Logs and traces are sent via OpenTelemetry to OTEL_EXPORTER_OTLP_ENDPOINT

volumes:
  postgres_data:
  redis_data:

networks:
  trading_network:
    driver: bridge
